# Biblioteca Chinoppo (puerto 8095) y Artwork Studio (puerto 3001)
# CAMBIA SOLO LAS LÍNEAS MARCADAS CON  <-- y nada más.
# Las claves de TMDb y fanart.tv NO van aquí: se pegan en Artwork Studio (http://IP-DEL-NAS:3001)
# la primera vez que lo abres, y se guardan en tu NAS.
services:
  biblioteca:
    build: .
    image: biblioteca-chinoppo:latest
    pull_policy: build          # siempre se reconstruye con estos archivos (una actualización nunca reutiliza la imagen vieja)
    container_name: biblioteca-chinoppo
    network_mode: host          # habla con el Chinoppo por la red de casa
    user: "0:0"                 # para poder leer tus carpetas con los permisos del NAS (solo lectura, ver volumes)
    environment:
      CHINOPPO_IP: "192.168.1.16"                  # <-- IP de tu Chinoppo
      NFS_SERVER: "192.168.1.17"                   # <-- IP de tu NAS
      NFS_FOLDER: "volume1/Plex"                   # <-- la carpeta como la ves en el Chinoppo (Red > NFS), sin la / del inicio
      TZ: "America/Mexico_City"                    # <-- tu zona horaria: Europe/Madrid, Europe/Rome, America/Bogota...
    volumes:
      - biblioteca_data:/app/data
      # La misma carpeta, como la ve el NAS, en solo lectura (el servicio nunca escribe en ella).
      # Ejemplos: Synology /volume1/Plex  QNAP /share/Plex  Unraid /mnt/user/Plex
      - /volume1/Plex:/media/Plex:ro               # <-- cambia solo lo de antes de :/media/Plex:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/d/folders')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Artwork Studio: elige carátulas, bandas de formato, estuches y discos (http://IP-DEL-NAS:3001).
  # No hay nada que cambiar aquí. Al abrirlo por primera vez te pide tus claves y se las pasa a la Biblioteca.
  artwork:
    build: ./artwork
    image: chinoppo-artwork-studio:latest
    pull_policy: build
    container_name: chinoppo-artwork-studio
    network_mode: host
    environment:
      BIBLIOTECA_URL: "http://127.0.0.1:8095"
      PORT: "3001"
    volumes:
      - artwork_data:/app/data
    depends_on:
      - biblioteca
    restart: unless-stopped

volumes:
  biblioteca_data:
    name: biblioteca_data
  artwork_data:
    name: artwork_data
