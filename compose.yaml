# Biblioteca Chinoppo (puerto 8095)
# CAMBIA SOLO LAS LÍNEAS MARCADAS CON  <-- y nada más.
services:
  biblioteca:
    build: .
    image: biblioteca-chinoppo:latest
    container_name: biblioteca-chinoppo
    network_mode: host          # habla con el Chinoppo por la red de casa
    environment:
      TMDB_API_KEY: "pon_aqui_tu_clave_de_tmdb"   # <-- tu clave de TMDb (la "Clave de la API")
      CHINOPPO_IP: "192.168.1.16"                  # <-- IP de tu Chinoppo
      NFS_SERVER: "192.168.1.17"                   # <-- IP de tu NAS
      NFS_FOLDER: "volume1/Plex"                   # <-- volume1/ + el nombre de tu carpeta compartida
      TZ: "America/Mexico_City"                    # <-- tu zona horaria
    volumes:
      - biblioteca_data:/app/data
      # Tu carpeta compartida, en solo lectura (el servicio nunca escribe en ella):
      - /volume1/Plex:/media/Plex:ro               # <-- la misma carpeta: /volume1/ + su nombre, y deja :/media/Plex:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/d/folders')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  biblioteca_data:
    name: biblioteca_data
