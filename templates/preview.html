<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vista previa · Biblioteca Chinoppo</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; margin: 0 auto; background: #07070a; }
  p { text-align: center; margin: 10px 16px; }
  a { color: #8ab4ff; }
  body.shot p { display: none; }
</style></head>
<body>
<canvas id="tv" width="1280" height="720" tabindex="0"></canvas>
<p>Vista previa de lo que ves en el Chinoppo. Teclado: flechas, <b>Enter</b> (OK) y <b>Esc</b> (POP-UP/rojo). Aquí no se reproduce nada. · <a href="/">Volver</a></p>
<script>
// A port of the disc's drawing (disc/src/org/biblio: Wall, Detail, SeriesDetail) to a 1280x720 canvas,
// fed by the same /d/ API. Open a screen directly: ?folder=ID&sel=N, &item=ID, &season=N (series episodes).
const W = 1280, H = 720, cv = document.getElementById("tv"), g = cv.getContext("2d");
const BG = "rgb(7,7,10)", SIDE = "rgb(16,16,22)", DIM = "rgb(150,150,160)", MUTED = "rgb(90,90,100)", CARD = "rgb(29,29,36)";
const P = new URLSearchParams(location.search);
if (P.has("shot")) document.body.classList.add("shot");
const font = (px, bold) => g.font = (bold ? "bold " : "") + px + "px Arial, Helvetica, sans-serif";
const lines = t => t.split("\n").filter(l => l.length);
const fields = l => l.split("\t");
const kv = t => Object.fromEntries(lines(t).map(l => { const i = l.indexOf("\t"); return i < 0 ? [l, ""] : [l.slice(0, i), l.slice(i + 1)]; }));
const txt = async p => { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.text(); };
const img = p => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = p; });
const q = encodeURIComponent;
let screen = null, pending = 0;
const repaint = () => screen && screen.paint();
function text(s, x, y, color) { if (color) g.fillStyle = color; g.fillText(s, x, y); }
function rect(x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function cut(s, width) {
  if (g.measureText(s).width <= width) return s;
  while (s.length > 1 && g.measureText(s + "...").width > width) s = s.slice(0, -1);
  return s + "...";
}
function wrap(s, width) {
  const out = []; let cur = "";
  for (const w of (s || "").split(" ")) {
    const next = cur ? cur + " " + w : w;
    if (g.measureText(next).width > width && cur) { out.push(cur); cur = w; } else cur = next;
  }
  if (cur) out.push(cur);
  return out;
}
function label(name, value, x, y, tw) {
  font(16, true); text(name, x, y, "#fff");
  font(18); text(cut(value, tw - 140), x + 140, y);
}

const Wall = {
  COLS: 7, PAGE: 14, PW: 150, PH: 225, GAP: 14, X0: 120, Y0: 82, ROW_H: 269,
  folders: [], icons: [], iconsSel: [], folderIdx: 0, menuIdx: 0, inMenu: false, items: [], sel: 0, posters: {}, message: "Cargando...",
  async start() {
    try {
      this.folders = lines(await txt("/d/folders")).map(fields);
      this.icons = await Promise.all(this.folders.map(f => img(`/d/img/icon?folder=${q(f[0])}&sel=0`)));
      this.iconsSel = await Promise.all(this.folders.map(f => img(`/d/img/icon?folder=${q(f[0])}&sel=1`)));
      const f = Math.max(0, this.folders.findIndex(x => x[0] === P.get("folder")));
      await this.openFolder(f, P.get("item"));
      if (P.has("sel")) { this.sel = Math.min(+P.get("sel"), this.items.length - 1); await this.loadPage(); }
      if (P.has("item") && this.items.length) await this.openDetail(P.get("season"));
    } catch (e) { this.message = "Sin conexion con el servidor"; }
    repaint();
  },
  async openFolder(f, itemId) {
    this.folderIdx = this.menuIdx = f;
    const ls = lines(await txt(`/d/items?folder=${q(this.folders[f][0])}`)).slice(1).map(fields);
    this.items = ls; this.sel = Math.max(0, ls.findIndex(r => r[0] === itemId));
    this.message = ls.length ? null : "Esta carpeta no tiene peliculas";
    await this.loadPage();
  },
  async loadPage() {
    const page = Math.floor(this.sel / this.PAGE), jobs = [];
    for (let i = 0; i < this.PAGE; i++) {
      const it = this.items[page * this.PAGE + i];
      if (it && !(it[0] in this.posters)) jobs.push(img(`/d/img/poster?id=${it[0]}&w=${this.PW}&h=${this.PH}`).then(im => { this.posters[it[0]] = im; repaint(); }));
    }
    await Promise.all(jobs);
  },
  async openDetail(season) {
    const it = this.items[this.sel];
    screen = it.length > 3 && it[3] === "series" ? new SeriesDetail(it[0]) : new Detail(it[0]);
    await screen.load(season);
  },
  key(k) {
    if (this.inMenu) {
      if (k === 38 && this.menuIdx > 0) this.menuIdx--;
      else if (k === 40 && this.menuIdx < this.folders.length - 1) this.menuIdx++;
      else if (k === 39 && this.items.length) this.inMenu = false;
      else if (k === 10) { this.inMenu = false; this.openFolder(this.menuIdx).then(repaint); }
    } else {
      const col = this.sel % this.COLS, n = this.items.length;
      if (k === 37) { if (col === 0) { this.inMenu = true; this.menuIdx = this.folderIdx; } else this.sel--; }
      else if (k === 39 && col < this.COLS - 1 && this.sel + 1 < n) this.sel++;
      else if (k === 38 && this.sel >= this.COLS) this.sel -= this.COLS;
      else if (k === 40 && this.sel + this.COLS < n) this.sel += this.COLS;
      else if (k === 40 && (Math.floor(this.sel / this.COLS) + 1) * this.COLS < n) this.sel = n - 1;
      else if (k === 461) { this.inMenu = true; this.menuIdx = this.folderIdx; }
      else if (k === 10 && n) { this.openDetail(); return; }
      this.loadPage();
    }
    repaint();
  },
  paint() {
    rect(0, 0, W, H, BG); rect(0, 0, 96, H, SIDE);
    const top = H / 2 - this.folders.length * 64 / 2;
    this.folders.forEach((f, i) => {
      const hi = this.inMenu ? i === this.menuIdx : i === this.folderIdx, ic = hi ? this.iconsSel[i] : this.icons[i];
      if (ic) g.drawImage(ic, 24, top + i * 64, 48, 48);
    });
    if (this.folders.length) {
      const title = this.folders[this.inMenu ? this.menuIdx : this.folderIdx][1];
      font(30, true); text(title, this.X0, 52, "#fff");
      const tw = g.measureText(title).width;
      if (!this.inMenu) { font(18); text(this.items.length + " titulos", this.X0 + 20 + tw, 52, DIM); }
    }
    const page = Math.floor(this.sel / this.PAGE);
    font(15);
    for (let i = 0; i < this.PAGE; i++) {
      const idx = page * this.PAGE + i, it = this.items[idx];
      if (!it) break;
      const x = this.X0 + (i % this.COLS) * (this.PW + this.GAP), y = this.Y0 + Math.floor(i / this.COLS) * this.ROW_H;
      if (idx === this.sel && !this.inMenu) rect(x - 4, y - 4, this.PW + 8, this.PH + 8, "#fff");
      const p = this.posters[it[0]];
      if (p) g.drawImage(p, x, y, this.PW, this.PH); else rect(x, y, this.PW, this.PH, SIDE);
      text(cut(it[1], this.PW), x, y + this.PH + 22, idx === this.sel ? "#fff" : DIM);
    }
    if (this.message) { font(24); text(this.message, this.X0, H / 2, "#fff"); }
    font(14); text("OK: abrir   POP-UP/ROJO: carpetas", this.X0, H - 20, DIM);
  },
};

class Detail {
  constructor(id) { this.id = id; this.m = {}; this.tx = 330; this.tw = 860; this.btn = 0; this.buttons = []; this.status = null; }
  async load() {
    const id = this.id;
    this.m = kv(await txt(`/d/item?id=${id}`));
    const resume = parseInt(this.m.resume) || 0;
    const hh = n => String(n).padStart(2, "0");
    this.buttons = resume > 60 ? [`Reanudar (${hh(Math.floor(resume / 3600))}:${hh(Math.floor(resume % 3600 / 60))})`, "Reproducir"] : ["Reproducir"];
    [this.backdrop, this.logo, this.poster, this.disc, this.badges] = await Promise.all([
      img(`/d/img/backdrop?id=${id}`), img(`/d/img/logo?id=${id}&w=500&h=140`), img(`/d/img/case?id=${id}&w=240&h=350`),
      img(`/d/img/disc?id=${id}&size=240&frames=1`), img(`/d/img/badges?id=${id}&h=30&w=790`)]);
    if (this.disc || this.m.hascase === "1") { this.tx = 460; this.tw = 790; }
    repaint();
  }
  key(k) {
    if (k === 461 || (k === 37 && this.btn === 0)) { screen = Wall; Wall.loadPage(); repaint(); return; }
    if (k === 37 && this.btn > 0) this.btn--;
    else if (k === 39 && this.btn < this.buttons.length - 1) this.btn++;
    else if (k === 10) this.status = "Vista previa: aqui no se reproduce";
    repaint();
  }
  paint() {
    const m = this.m, s = k => m[k] || "", tx = this.tx, tw = this.tw;
    rect(0, 0, W, H, BG);
    if (this.backdrop) g.drawImage(this.backdrop, 0, 0, W, H);
    if (this.disc) { const D = 240; g.drawImage(this.disc, 70 + 230 - D / 2 + D / 2, 290 + 175 - D / 2); }
    if (this.poster) g.drawImage(this.poster, 70, 290);
    if (this.logo) g.drawImage(this.logo, tx, 342 - this.logo.height);
    else { font(32, true); text(cut(s("title"), tw), tx, 330, "#fff"); }
    font(20);
    const facts = [s("rating") && s("rating") !== "0.0" ? "Nota " + s("rating") : "", s("certification") ? "+" + s("certification") : "",
                   s("year"), parseInt(s("runtime")) > 0 ? s("runtime") + " min" : ""].filter(Boolean).join("  -  ");
    text(facts, tx, 366, "#fff");
    let y = 408, maxLines = 5;
    if (this.badges || s("badges")) { if (this.badges) g.drawImage(this.badges, tx, 380); y += 40; maxLines = 4; }
    wrap(s("overview"), tw).slice(0, maxLines).forEach(l => { text(l, tx, y); y += 26; });
    y += 16;
    for (const [name, key] of [["CATEGORIAS", "genres"], ["DIRECTOR", "director"], ["REPARTO", "cast"]])
      if (s(key)) { label(name, s(key), tx, y, tw); y += 28; }
    let bx = tx; font(20, true);
    this.buttons.forEach((b, i) => {
      const bw = g.measureText(b).width + 44;
      rect(bx, 640, bw, 44, i === this.btn ? "#fff" : "rgb(40,40,50)");
      text(b, bx + 22, 669, i === this.btn ? "#000" : "#fff");
      bx += bw + 16;
    });
    font(14); text("POP-UP/ROJO: volver", W - 200, H - 14, DIM);
    if (this.status) { font(22); text(this.status, bx + 10, 669, "#fff"); }
  }
}

class SeriesDetail {
  constructor(id) { Object.assign(this, { id, m: {}, seasons: [], counts: [], seasonIdx: 0, firstSeason: 0, posters: {}, eps: [], epIdx: 0, first: 0, stills: {}, onEpisodes: false, status: null }); }
  async load(season) {
    const id = this.id;
    this.m = kv(await txt(`/d/item?id=${id}`));
    this.seasons = this.m.seasons ? this.m.seasons.split(",") : [];
    this.counts = this.m.season_counts ? this.m.season_counts.split(",") : [];
    if (!this.seasons.length) this.status = "No hay episodios en el NAS";
    [this.logo, this.poster, this.backdrop] = await Promise.all([img(`/d/img/logo?id=${id}&w=420&h=80`), img(`/d/img/case?id=${id}&w=200&h=290`), img(`/d/img/backdrop?id=${id}`)]);
    await this.loadSeasonPosters();
    if (season != null && this.seasons.includes(season)) {
      this.seasonIdx = this.seasons.indexOf(season);
      this.firstSeason = Math.max(0, this.seasonIdx - 6);
      await this.openSeason();
    }
    repaint();
  }
  async loadSeasonPosters() {
    await Promise.all(this.seasons.slice(this.firstSeason, this.firstSeason + 7).map(sn =>
      sn in this.posters ? null : img(`/d/img/season?id=${this.id}&season=${sn}&w=140&h=210`).then(im => { this.posters[sn] = im; repaint(); })));
  }
  async openSeason() {
    this.onEpisodes = true; this.eps = [];
    const sn = this.seasons[this.seasonIdx];
    [this.seasonTop, this.seasonBadges] = await Promise.all([img(`/d/img/season?id=${this.id}&season=${sn}&w=180&h=270`), img(`/d/img/badges?id=${this.id}&season=${sn}&h=28&w=680`)]);
    this.eps = lines(await txt(`/d/episodes?id=${this.id}&season=${sn}`)).map(fields);
    this.epIdx = Math.max(0, this.eps.findIndex(e => e[3] !== "0"));
    this.first = Math.max(0, Math.min(this.epIdx, this.eps.length - 4));
    await this.loadStills();
  }
  async loadStills() {
    const sn = this.seasons[this.seasonIdx];
    await Promise.all(this.eps.slice(this.first, this.first + 4).map(e => {
      const k = sn + ":" + e[0];
      return k in this.stills ? null : img(`/d/img/still?id=${this.id}&season=${sn}&episode=${e[0]}&w=240&h=135`).then(im => { this.stills[k] = im; repaint(); });
    }));
  }
  key(k) {
    if (k === 461) { screen = Wall; Wall.loadPage(); repaint(); return; }
    if (this.onEpisodes && k === 38) this.onEpisodes = false;
    else if (!this.onEpisodes && (k === 37 || k === 39)) {
      const next = this.seasonIdx + (k === 37 ? -1 : 1);
      if (next >= 0 && next < this.seasons.length) {
        this.seasonIdx = next;
        let f = Math.max(0, Math.min(this.firstSeason, next));
        if (next >= f + 7) f = next - 6;
        this.firstSeason = f; this.loadSeasonPosters();
      }
    } else if (!this.onEpisodes && (k === 10 || k === 40) && this.seasons.length) this.openSeason().then(repaint);
    else if (this.onEpisodes && k === 37 && this.epIdx > 0) { this.epIdx--; if (this.epIdx < this.first) { this.first = this.epIdx; this.loadStills(); } }
    else if (this.onEpisodes && k === 39 && this.epIdx < this.eps.length - 1) { this.epIdx++; if (this.epIdx >= this.first + 4) { this.first = this.epIdx - 3; this.loadStills(); } }
    else if (this.onEpisodes && k === 10) this.status = "Vista previa: aqui no se reproduce";
    repaint();
  }
  paint() {
    const m = this.m, s = k => m[k] || "", CX = 60, TX = 270, TW = 950;
    rect(0, 0, W, H, BG);
    if (this.backdrop) g.drawImage(this.backdrop, 0, 0, W, H);
    if (this.onEpisodes && this.seasonTop) g.drawImage(this.seasonTop, CX, 60);
    else if (this.poster) g.drawImage(this.poster, CX - 10, 50);
    if (this.logo) g.drawImage(this.logo, TX, 106 - this.logo.height);
    else { font(32, true); text(cut(s("title"), TW), TX, 95, "#fff"); }
    font(20);
    const n = this.seasons.length;
    const facts = [s("rating") && s("rating") !== "0.0" ? "Nota " + s("rating") : "", s("year"), n + (n === 1 ? " temporada" : " temporadas")].filter(Boolean).join("  -  ");
    text(facts, TX, 130, "#fff");
    let y = 168;
    wrap(s("overview"), TW).slice(0, 3).forEach(l => { text(l, TX, y); y += 26; });
    y += 12;
    if (s("director")) { label("CREADORES", s("director"), TX, y, TW); y += 28; }
    if (s("cast")) label("REPARTO", s("cast"), TX, y, TW);
    if (this.onEpisodes) this.paintEpisodes(CX); else this.paintSeasons(CX);
    font(14);
    text(this.onEpisodes ? "OK: reproducir   ARRIBA: temporadas   POP-UP/ROJO: volver" : "OK: ver episodios   POP-UP/ROJO: volver", CX, H - 14, DIM);
    if (this.status) { font(22); text(this.status, CX + 300, 437, "#fff"); }
  }
  paintSeasons(CX) {
    const SY = 400, SW = 140, SH = 210;
    font(22, true); text("Temporadas", CX, SY - 14, "#fff");
    for (let i = 0; i < 7; i++) {
      const k = this.firstSeason + i, sn = this.seasons[k];
      if (sn == null) break;
      const x = CX + i * (SW + 22);
      if (k === this.seasonIdx) rect(x - 4, SY - 4, SW + 8, SH + 8, "#fff");
      const p = this.posters[sn];
      if (p) g.drawImage(p, x, SY, SW, SH); else rect(x, SY, SW, SH, CARD);
      font(16, true); text("Temporada " + sn, x, SY + SH + 24, "#fff");
      if (k < this.counts.length) { font(14); text(this.counts[k] + (this.counts[k] === "1" ? " episodio" : " episodios"), x, SY + SH + 44, DIM); }
    }
    if (this.seasons.length > 7) { font(14); text((this.seasonIdx + 1) + " / " + this.seasons.length, CX + 7 * 162 - 80, SY - 14, DIM); }
  }
  paintEpisodes(CX) {
    const CY = 470, CW = 240, CH = 135, sn = this.seasons[this.seasonIdx];
    font(22, true); text("Temporada " + sn, CX, 437, "#fff");
    if (this.seasonBadges) g.drawImage(this.seasonBadges, CX + 230, 437 - 28 + 4);
    for (let i = 0; i < 4; i++) {
      const e = this.first + i, ep = this.eps[e];
      if (!ep) break;
      const x = CX + i * (CW + 26), has = ep[3] !== "0", st = this.stills[sn + ":" + ep[0]];
      if (e === this.epIdx) rect(x - 4, CY - 4, CW + 8, CH + 8, "#fff");
      if (st && has) g.drawImage(st, x, CY, CW, CH); else rect(x, CY, CW, CH, CARD);
      font(16, true); text(cut(`S${sn}:E${ep[0]} - ${ep[1]}`, CW), x, CY + CH + 24, has ? "#fff" : MUTED);
      font(14); text(has ? ep[2] : "No esta en el NAS", x, CY + CH + 44, has ? DIM : MUTED);
    }
    if (this.eps.length > 4) { font(14); text((this.epIdx + 1) + " / " + this.eps.length, W - 120, CY - 12, DIM); }
  }
}

const KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Enter: 10, Escape: 461, Backspace: 461 };
addEventListener("keydown", e => { const k = KEYS[e.key]; if (k && screen) { e.preventDefault(); screen.key(k); } });
screen = Wall;
Wall.start().then(() => { repaint(); document.title += ""; window.ready = true; });
cv.focus();
</script>
</body></html>
